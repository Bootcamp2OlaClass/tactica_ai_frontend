name: Frontend CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Inlined at build time (Next.js NEXT_PUBLIC_* vars aren't
          # runtime-configurable) -- a placeholder is fine for CI, which
          # only needs the build to succeed, not to talk to a real backend.
          # See BUGS.md BUG-009 for why this matters for a real deploy.
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
